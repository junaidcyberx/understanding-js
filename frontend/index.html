<!DOCTYPE html>
<html>
<head>
    <title>User Form</title>
</head>

<body>

    <h2>User Form</h2>

    <form id="userForm">

        <input type="text" id="name" placeholder="Name" required>
        <br><br>

        <input type="text" id="gender" placeholder="Gender" required>
        <br><br>

        <input type="date" id="dob" required>
        <br><br>

        <input type="text" id="parentage" placeholder="Father Name" required>
        <br><br>

        <input type="text" id="phonenumder" placeholder="Phone Number" required>
        <br><br>

        <button type="submit">Submit</button>

    </form>


    <script>

        document.getElementById("userForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            // Get data from form
            const data = {
                name: document.getElementById("name").value,
                gender: document.getElementById("gender").value,
                dob: document.getElementById("dob").value,
                parentage: document.getElementById("parentage").value,
                phonenumder: document.getElementById("phonenumder").value
            };

            try {

                // Send request to FastAPI
                const response = await fetch("https://6ldl2k53-8000.inc1.devtunnels.ms/submit", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                // Show backend response
                if (result.success) {
                    alert(result.message);
                } else {
                    alert("Something went wrong!");
                }

            } catch (error) {

                alert("Could not connect to backend.");

            }

        });

    </script>

</body>
</html>
